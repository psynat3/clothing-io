<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clothing.io | Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" type="text/css" />
    <script src="js/app.js" defer></script>

  <body data-page="cart">
    <header role="banner" class="site-header">
      <a class="brand" href="index.html" title="clothing.io home">clothing.io</a>
      <nav role="navigation" aria-label="Main">

          <li><a href="index.html" title="Home">Home</a></li>

    <main role="main">

    <footer role="contentinfo" class="site-footer">
      <p>&copy; 2026 clothing.io</p>
    </footer>

    <div id="status" class="status" role="status" aria-live="polite"></div>
