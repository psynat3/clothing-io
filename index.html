<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clothing.io | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" type="text/css" />
    <script src="js/app.js" defer></script>
  </head>
  <body data-page="home">
    <header role="banner" class="site-header">
      <a class="brand" href="index.html" title="clothing.io home">clothing.io</a>
      <nav role="navigation" aria-label="Main">
        <ul>
          <li><a href="index.html" title="Home" aria-current="page">Home</a></li>
          <li><a href="shop.html" title="Shop all clothing">Shop</a></li>
          <li><a href="wishlist.html" title="Your wishlist">Wishlist <span class="badge" id="wishlist-count" hidden>0</span></a></li>
          <li><a href="cart.html" title="Your cart">Cart <span class="badge" id="cart-count" hidden>0</span></a></li>
        </ul>
      </nav>
    </header>

    <main role="main">
      <section class="hero">
        <h1>Everyday clothes, no fuss.</h1>
        <p>Simple pieces in fabrics that hold up. Save what you like, add what you need, and check out when you're ready.</p>
        <a class="btn" href="shop.html" title="Browse all clothing">Shop all clothing</a>
      </section>

      <section aria-labelledby="featured-title">
        <div class="section-head">
          <h2 id="featured-title">Featured</h2>
          <a href="shop.html" title="See every item in the shop">See the full shop</a>
        </div>
        <div class="grid" id="featured-grid"></div>
        <noscript><p>clothing.io needs JavaScript turned on to show products.</p></noscript>
      </section>
    </main>

    <footer role="contentinfo" class="site-footer">
      <p>&copy; 2026 clothing.io</p>
    </footer>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </body>
</html>
